<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Thuis</title>
<meta name="theme-color" content="#f5f0e6">
<!-- Webapp: op iPad/telefoon via 'Zet op beginscherm' schermvullend te openen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Thuis">
<link rel="apple-touch-icon" href="icoon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath d=%22M12 2.5 1.5 12H5v9.5h5v-6h4v6h5V12h3.5z%22 fill=%22%23f6cf4f%22 stroke=%22%23f6cf4f%22 stroke-width=%221%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<script>
/* Thema: een telefoon volgt zijn eigen instelling (licht/donker); iPad en computer zijn altijd licht.
   Een telefoon herkennen we aan de korte kant van het scherm. */
(function(){
  var donkerVraag = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  function zet(){
    var telefoon = Math.min(screen.width, screen.height) <= 500;
    var donker = !!(telefoon && donkerVraag && donkerVraag.matches);
    document.documentElement.classList.toggle('donker', donker);
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', donker ? '#172135' : '#f5f0e6');
  }
  zet();
  if (donkerVraag) { if (donkerVraag.addEventListener) donkerVraag.addEventListener('change', zet); else if (donkerVraag.addListener) donkerVraag.addListener(zet); }
})();
</script>
<style>
/* Alle maten hangen aan twee eenheden die het script bij het laden/draaien zet:
   --s  schaal van de linkerkolom (1px op een scherm van 1024 breed)
   --u  één eenheid van de plattegrond (zie PLATTEGROND onderaan) */
:root{
  --s:1px; --u:1px;
  --ease:cubic-bezier(.4,0,.2,1);
  --schaduw:calc(var(--s)*8) calc(var(--s)*9) calc(var(--s)*20) var(--schaduw-d),
            calc(var(--s)*-6) calc(var(--s)*-6) calc(var(--s)*16) var(--schaduw-l);

  /* Licht thema (standaard, en altijd op iPad en computer): off-white, dune sand, warm clay en espresso */
  --bg:#f5f0e6; --bg-grad:radial-gradient(ellipse 95% 85% at 28% 18%,#fcf9f3 0%,#f5f0e6 52%,#ece4d6 100%);
  --vlak:#f6f1e8; --diep:#e9e0d1;
  --kamer:#e4d2bb; --hal:#d6bfa3; --muur:#40332b;
  --txt:#3a2a22; --muted:rgba(58,42,34,.62); --faint:rgba(58,42,34,.34);
  --accent:#b9735a; --accent-tekst:#a35f47; --rood:#b4513a;
  --accent-grad:linear-gradient(160deg,#cf8f76 0%,#b06a50 100%); --accent-ink:#fff8ef;
  --accent-gloed:rgba(185,115,90,.5); --accent-schaduw:rgba(96,50,34,.3);
  --schaduw-d:rgba(110,84,60,.26); --schaduw-l:rgba(255,255,255,.95);
  --inzet-d:rgba(110,84,60,.28); --inzet-l:rgba(255,255,255,.9);
  --ink-zacht:#8a7566; --chip-aan:linear-gradient(160deg,#ecd6c8,#e2c2af);
  --muur-d:rgba(64,45,34,.35); --muur-l:rgba(255,255,255,.7);
  --kamer-l:rgba(255,255,255,.45); --kamer-d:rgba(96,72,52,.14);
  --gloed-1:rgba(190,118,92,.78); --gloed-2:rgba(201,140,114,.58); --gloed-3:rgba(214,172,146,.34); --gloed-4:rgba(228,210,187,0);
  --vol-grad:linear-gradient(180deg,#d7a48d 0%,#c58a70 100%); --vol-ink:#3a2a22; --vol-pil:rgba(58,42,34,.14);
  --balk-1:rgba(160,95,70,.08); --balk-2:rgba(160,95,70,.32); --balk-rand:rgba(150,85,62,.85);
  --volbalk-1:rgba(58,42,34,.05); --volbalk-2:rgba(58,42,34,.2); --volbalk-rand:rgba(58,42,34,.55);
  --knop-bg:#f6f0e6; --knop-d:rgba(96,72,52,.3); --knop-l:rgba(255,255,255,.75); --knop-icoon:#9a8576;
  --paneel-achter:rgba(58,42,34,.38); --vel:#f6f1e8; --lijn:rgba(58,42,34,.09);
  --lamp-bg:#efe7da; --lamp-aan-bg:#ecd9cc; --lamp-aan-rand:rgba(185,115,90,.55);
  --schakel-knop:#b3a191; --spoor:rgba(58,42,34,.13);
  --meld-bg:#f8e4dc; --meld-rand:rgba(180,81,58,.5); --meld-txt:#7a2f1e;
  --w-zon:#c9825f; --w-maan:#40332b; --w-wolk:#d4bea4; --w-wolk-donker:#a58f79;
  --w-drup:#8a7566; --w-vlok:#b3a191; --w-bliksem:#b9735a;
  --party-uit:#a8978a; --party-aan:#a35f47; --party-aan-bg:linear-gradient(160deg,#ecd6c8,#e2c2af);
}
/* Donker thema (donkerblauw met warm geel licht): alleen op een telefoon die zelf op donker staat */
html.donker{
  --bg:#172135; --bg-grad:radial-gradient(ellipse 95% 85% at 28% 18%,#1e2a43 0%,#172135 52%,#121a2b 100%);
  --vlak:#1c2740; --diep:#141c2e;
  --kamer:#25334f; --hal:#3a4864; --muur:#1c2842;
  --txt:#f2f5fa; --muted:rgba(226,232,244,.62); --faint:rgba(226,232,244,.32);
  --accent:#f6cf4f; --accent-tekst:#f6cf4f; --rood:#e58a70;
  --accent-grad:linear-gradient(160deg,#ffeb9c 0%,#f3c440 100%); --accent-ink:#4a3a08;
  --accent-gloed:rgba(255,216,96,.55); --accent-schaduw:rgba(110,84,10,.35);
  --schaduw-d:rgba(6,10,20,.62); --schaduw-l:rgba(92,114,158,.12);
  --inzet-d:rgba(4,7,14,.7); --inzet-l:rgba(92,114,158,.14);
  --ink-zacht:#9aa7c0; --chip-aan:linear-gradient(160deg,#4a4630,#2c3040);
  --muur-d:rgba(5,9,18,.62); --muur-l:rgba(92,114,158,.11);
  --kamer-l:rgba(255,255,255,.05); --kamer-d:rgba(8,12,24,.22);
  --gloed-1:rgba(255,231,140,.84); --gloed-2:rgba(228,199,102,.62); --gloed-3:rgba(160,150,90,.38); --gloed-4:rgba(60,75,95,0);
  --vol-grad:linear-gradient(180deg,#fff5c8 0%,#f8e5a2 100%); --vol-ink:#2c2a1f; --vol-pil:rgba(70,58,12,.14);
  --balk-1:rgba(255,226,130,.08); --balk-2:rgba(255,226,130,.34); --balk-rand:rgba(255,238,175,.85);
  --volbalk-1:rgba(120,90,10,.05); --volbalk-2:rgba(120,90,10,.22); --volbalk-rand:rgba(120,90,10,.55);
  --knop-bg:#2b3854; --knop-d:rgba(8,12,24,.5); --knop-l:rgba(130,150,190,.16); --knop-icoon:#8f9cb6;
  --paneel-achter:rgba(6,10,20,.6); --vel:#182236; --lijn:rgba(255,255,255,.06);
  --lamp-bg:#1f2b45; --lamp-aan-bg:#2a3147; --lamp-aan-rand:rgba(246,207,79,.45);
  --schakel-knop:#56627c; --spoor:rgba(255,255,255,.10);
  --meld-bg:#2a1b1a; --meld-rand:rgba(229,138,112,.5); --meld-txt:#ffd9cf;
  --w-zon:#f6cf4f; --w-maan:#e9eef8; --w-wolk:#b9c5db; --w-wolk-donker:#8492ad;
  --w-drup:#8cc0ff; --w-vlok:#eef3fb; --w-bliksem:#ffd84a;
  --party-uit:#6f7b96; --party-aan:#e2b6ff; --party-aan-bg:linear-gradient(160deg,#3a2f52,#232a44);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--txt);
  font-family:Roboto,"Google Sans","Segoe UI",ui-sans-serif,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;touch-action:manipulation}
body{background:var(--bg);background:var(--bg-grad)}
button{font-family:inherit;color:inherit;margin:0}

#app{display:flex;align-items:stretch;height:100%;padding:calc(var(--s)*28)}
/* Schermvullende webapp: ruimte laten voor statusbalk en afgeronde hoeken */
@supports (padding:max(0px)){
  #app{padding-top:max(calc(var(--s)*28),env(safe-area-inset-top));padding-bottom:max(calc(var(--s)*28),env(safe-area-inset-bottom));
    padding-left:max(calc(var(--s)*28),env(safe-area-inset-left));padding-right:max(calc(var(--s)*28),env(safe-area-inset-right))}
}

/* ---------- Linkerkolom: klok, datum, alles uit, weer ---------- */
#links{position:relative;z-index:2;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:flex-start;
  padding:calc(var(--s)*20) 0 calc(var(--s)*6) calc(var(--s)*28)}
.klok{font-size:calc(var(--s)*132);line-height:1;font-weight:400;letter-spacing:-.015em;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.datum{display:flex;align-items:center;margin-top:calc(var(--s)*12);font-size:calc(var(--s)*26);white-space:nowrap}
.stip{flex:0 0 auto;width:calc(var(--s)*9);height:calc(var(--s)*9);margin-left:calc(var(--s)*14);border-radius:50%;
  background:#6fbf73;opacity:.85;transition:background .3s}
.stip.bezig{background:var(--accent)}
.stip.fout{background:var(--rood)}

.kop{display:flex;align-items:center}
/* 'Alle lampen uit': alleen een doorgestreept lampje, even groot als de stofzuigerknop */
.uit-knop{appearance:none;-webkit-appearance:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  width:calc(var(--s)*76);height:calc(var(--s)*54);padding:0;
  border-radius:calc(var(--s)*15);background:var(--vlak);box-shadow:var(--schaduw);
  transition:transform .15s var(--ease)}
.uit-knop:active{transform:scale(.97)}
.uit-knop span{display:flex}
.uit-knop svg{width:calc(var(--s)*34);height:calc(var(--s)*34);stroke:var(--ink-zacht);stroke-width:1.5}

/* Agenda: vult de ruimte tussen de datum en de knoppen; wat niet past blijft weg */
#agenda{flex:1 1 0;min-height:0;overflow:hidden;width:calc(var(--s)*310);margin-top:calc(var(--s)*20)}
.dag{margin:calc(var(--s)*12) 0 calc(var(--s)*3);font-size:calc(var(--s)*13);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.afspraak{display:flex;align-items:baseline;font-size:calc(var(--s)*19);line-height:1.5}
.afspraak time{flex:0 0 auto;min-width:calc(var(--s)*58);margin-right:calc(var(--s)*10);color:var(--muted);font-variant-numeric:tabular-nums}
.afspraak span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.onder{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start}
.chip{display:flex;align-items:center;height:calc(var(--s)*48);margin-top:calc(var(--s)*16);padding:0 calc(var(--s)*18);
  border:0;border-radius:calc(var(--s)*13);background:var(--vlak);box-shadow:var(--schaduw);
  font-size:calc(var(--s)*21);white-space:nowrap}
.chip svg{width:calc(var(--s)*26);height:calc(var(--s)*26);margin-right:calc(var(--s)*12);stroke:var(--ink-zacht)}
.chip small{margin-left:calc(var(--s)*10);font-size:calc(var(--s)*15);color:var(--muted)}
button.chip{cursor:pointer}
.chip.aan{background:var(--chip-aan)}
.chip.aan small{color:var(--accent-tekst)}

/* ---------- Plattegrond ---------- */
#plan{position:relative;flex:0 0 auto;align-self:center;width:calc(var(--u)*660);height:calc(var(--u)*652)}
#plan svg.muur{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;
  -webkit-filter:drop-shadow(calc(var(--u)*10) calc(var(--u)*12) calc(var(--u)*16) var(--muur-d))
                 drop-shadow(calc(var(--u)*-5) calc(var(--u)*-5) calc(var(--u)*12) var(--muur-l));
  filter:drop-shadow(calc(var(--u)*10) calc(var(--u)*12) calc(var(--u)*16) var(--muur-d))
         drop-shadow(calc(var(--u)*-5) calc(var(--u)*-5) calc(var(--u)*12) var(--muur-l))}
svg.muur path{fill:var(--muur)}

.kamer{position:absolute;overflow:hidden;cursor:pointer;border-radius:calc(var(--u)*7);background:var(--kamer);
  box-shadow:inset 0 calc(var(--u)*1.5) 0 var(--kamer-l),inset 0 calc(var(--u)*-3) calc(var(--u)*8) var(--kamer-d);
  transition:color .4s}
.kamer.hal{background:var(--hal)}
.kamer::before{content:"";position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;opacity:0;
  transition:opacity .45s var(--ease);
  background:radial-gradient(circle calc(var(--u)*560) at var(--bx) var(--by),
    var(--gloed-1) 0%,var(--gloed-2) 26%,var(--gloed-3) 58%,var(--gloed-4) 100%)}
.kamer.vol::before{background:var(--vol-grad)}
.kamer.aan::before{opacity:var(--gloed,1)}
.kamer.vol.aan{color:var(--vol-ink)}
.kamer > *{position:absolute}
.kamer{touch-action:none}

/* Helderheidsbalk tijdens het vegen */
.balk{left:0;top:0;bottom:0;width:0;pointer-events:none;opacity:0;transition:opacity .5s var(--ease);
  background:linear-gradient(90deg,var(--balk-1),var(--balk-2));
  border-right:calc(var(--u)*2.5) solid var(--balk-rand)}
.kamer.draai .balk{top:auto;width:100%;height:0;border-right:0;
  background:linear-gradient(0deg,var(--balk-1),var(--balk-2));
  border-top:calc(var(--u)*2.5) solid var(--balk-rand)}
.kamer.vol .balk{background:linear-gradient(90deg,var(--volbalk-1),var(--volbalk-2));border-color:var(--volbalk-rand)}
.kamer.dimt .balk{opacity:1}
.kamer.dimt .status{color:var(--txt);font-size:calc(var(--u)*19)}
.kamer.vol.dimt .status{color:var(--vol-ink)}

.naam{-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);font-size:calc(var(--u)*25);white-space:nowrap}
.kamer.draai .naam{-webkit-transform:translate(-50%,-50%) rotate(-90deg);transform:translate(-50%,-50%) rotate(-90deg)}
.status{-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);font-size:calc(var(--u)*15);white-space:nowrap;
  color:var(--muted);padding:calc(var(--u)*2) calc(var(--u)*10);border-radius:calc(var(--u)*20);transition:color .4s,background .4s}
.kamer.aan .status{color:var(--txt)}
.kamer.vol.aan .status{color:var(--vol-ink);background:var(--vol-pil)}

.knop{appearance:none;-webkit-appearance:none;border:0;padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  width:calc(var(--u)*64);height:calc(var(--u)*64);border-radius:50%;
  -webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);background:var(--knop-bg);
  box-shadow:calc(var(--u)*4) calc(var(--u)*5) calc(var(--u)*11) var(--knop-d),
             calc(var(--u)*-3) calc(var(--u)*-3) calc(var(--u)*8) var(--knop-l);
  transition:background .35s,box-shadow .35s}
.knop svg{width:calc(var(--u)*31);height:calc(var(--u)*31);stroke:var(--knop-icoon);transition:stroke .35s}
.knop:active{-webkit-transform:translate(-50%,-50%) scale(.92);transform:translate(-50%,-50%) scale(.92)}
.kamer.aan .knop{background:var(--accent-grad);
  box-shadow:0 0 calc(var(--u)*26) var(--accent-gloed),calc(var(--u)*3) calc(var(--u)*5) calc(var(--u)*10) var(--accent-schaduw)}
.kamer.aan .knop svg{stroke:var(--accent-ink)}
.kamer.bezig .knop{animation:puls 1s ease-in-out infinite}
.kamer.leeg{cursor:default}
.kamer.leeg .knop,.kamer.leeg .status{opacity:.4}
@keyframes puls{50%{opacity:.5}}

/* ---------- Paneel met losse lampen ---------- */
#paneel{position:fixed;left:0;top:0;right:0;bottom:0;z-index:20;display:none;justify-content:flex-end;background:var(--paneel-achter)}
#paneel.open{display:flex}
.vel{width:560px;max-width:92vw;height:100%;display:flex;flex-direction:column;padding:18px 20px;
  background:var(--vel);border-left:1px solid var(--lijn);animation:schuif .22s var(--ease)}
@keyframes schuif{from{transform:translateX(40px);opacity:0}}
.vel-kop{display:flex;align-items:center;margin-bottom:12px}
.vel-kop b{flex:1;font-size:26px;font-weight:500}
.sluit{appearance:none;-webkit-appearance:none;width:50px;height:50px;margin-left:14px;padding:0;border:0;border-radius:50%;
  background:var(--vlak);box-shadow:4px 5px 12px var(--schaduw-d),-3px -3px 9px var(--schaduw-l);
  font-size:28px;line-height:1;cursor:pointer}
#lampen{flex:1;overflow-y:auto;scrollbar-width:none}
#lampen::-webkit-scrollbar{display:none}
.lamp{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:10px;padding:12px 16px;border-radius:16px;
  background:var(--lamp-bg);border:1px solid var(--lijn)}
.lamp.aan{border-color:var(--lamp-aan-rand);background:var(--lamp-aan-bg)}
.lamp.geheel{background:var(--vlak);margin-bottom:16px}
.lamp .ln{flex:1;min-width:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lamp.geheel .ln{flex:0 0 100%;color:var(--muted);font-size:16px}
.lamp .ln small{display:block;font-size:13px;color:var(--rood)}
.lamp .dim{flex:0 0 100%;display:flex;align-items:center;margin-top:4px}
.lamp .pct{width:54px;text-align:right;font-size:16px;font-variant-numeric:tabular-nums;color:var(--muted)}
.lamp.offline{opacity:.5}
.schakel{appearance:none;-webkit-appearance:none;position:relative;flex:0 0 auto;width:72px;height:42px;padding:0;
  border:0;border-radius:999px;background:var(--diep);cursor:pointer;transition:background .25s;
  box-shadow:inset 2px 2px 6px var(--inzet-d)}
.schakel::after{content:"";position:absolute;top:5px;left:5px;width:32px;height:32px;border-radius:50%;
  background:var(--schakel-knop);transition:transform .25s var(--ease),background .25s}
.aan > .schakel{background:var(--accent-grad)}
.aan > .schakel::after{transform:translateX(30px);background:#fff}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:40px;margin:0;background:transparent;touch-action:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:999px;
  background:linear-gradient(90deg,var(--accent) 0,var(--accent) var(--v,50%),var(--spoor) var(--v,50%),var(--spoor) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-11px;border-radius:50%;
  background:#fff;border:3px solid var(--accent);box-shadow:0 2px 10px var(--knop-d)}
input[type=range]::-moz-range-track{height:12px;border-radius:999px;background:var(--spoor)}
input[type=range]::-moz-range-progress{height:12px;border-radius:999px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
input[type=range]:disabled{opacity:.35}

/* Warm/koud wit en kleur in het paneel (kamer lang indrukken) */
.lamp .wit{flex:0 0 100%;display:flex;align-items:center;padding-right:54px}
input[type=range].warm::-webkit-slider-runnable-track{background:linear-gradient(90deg,#ffb25a 0%,#fff1dc 50%,#cfe3ff 100%)}
input[type=range].warm::-moz-range-track{background:linear-gradient(90deg,#ffb25a 0%,#fff1dc 50%,#cfe3ff 100%)}
input[type=range].warm::-moz-range-progress{background:transparent}
.lamp .kleuren{flex:0 0 100%;display:flex;flex-wrap:wrap;margin-top:6px}
.kl{appearance:none;-webkit-appearance:none;width:34px;height:34px;margin:0 10px 6px 0;padding:0;border-radius:50%;cursor:pointer;
  border:3px solid transparent;box-shadow:0 1px 4px var(--knop-d);transition:transform .15s}
.kl:active{transform:scale(.9)}
.kl.actief{border-color:var(--txt)}

/* ---------- Thermostaat: temperatuur met een knopje omlaag en omhoog ---------- */
.thermo{display:flex;align-items:center;margin-top:calc(var(--s)*14);padding:calc(var(--s)*12) calc(var(--s)*12) calc(var(--s)*12) calc(var(--s)*20);
  border-radius:calc(var(--s)*16);background:var(--vlak);box-shadow:var(--schaduw)}
.thermo.voorbeeld{opacity:.6}
.th-nu{display:flex;flex-direction:column;margin-right:calc(var(--s)*18);white-space:nowrap}
.th-nu b{font-size:calc(var(--s)*50);font-weight:400;line-height:1.05;font-variant-numeric:tabular-nums}
.th-nu small{margin-top:calc(var(--s)*2);font-size:calc(var(--s)*15);color:var(--muted)}
.th-zet{display:flex;align-items:center}

      '<g class="warm"><path d="M8 6.5c-.9-1 .9-1.7 0-3M12 6.5c-.9-1 .9-1.7 0-3M16 6.5c-.9-1 .9-1.7 0-3"/></g>'),
    disco: svg('<path d="M12 2v5"/><circle cx="12" cy="14" r="7"/><path d="M5.4 12h13.2M5.4 16h13.2"/><path d="M12 7c-2.6 2-2.6 12 0 14M12 7c2.6 2 2.6 12 0 14"/>'),
    sneeuw: svg('<path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24"/><path d="M8 15h.01M8 19h.01M12 17h.01M12 21h.01M16 15h.01M16 19h.01"/>')
  };

  var ruimtes = [];
  var bezig = {};          // ruimte-id -> aantal lopende opdrachten
  var open = null;         // ruimte-id van het geopende paneel
  var bijwerkTimer = null;

  var $ = function(id){ return document.getElementById(id); };
  $('uitIcoon').innerHTML = ICOON.lampUit;

  /* ---------- Maatvoering ---------- */
  /* De twee eenheden worden zo gekozen dat alles altijd op het scherm past, liggend en
     staand: eerst een schatting, daarna meten en verkleinen tot niets meer buiten beeld
     valt of over de plattegrond heen ligt. */
  function zetMaat(s, u){
    var st = document.documentElement.style;
    st.setProperty('--s', s.toFixed(4) + 'px');
    st.setProperty('--u', u.toFixed(4) + 'px');
  }
  /* Kleinste x van de buitenmuur tussen twee hoogtes (in eenheden van de plattegrond). */
  function muurLinks(y0, y1){
    var m = PLATTEGROND.muur, min = Infinity;
    for (var i = 0; i < m.length; i++) {
      var a = m[i], b = m[(i + 1) % m.length];
      if (Math.max(a[1], b[1]) <= y0 || Math.min(a[1], b[1]) >= y1) continue;
      min = Math.min(min, a[0], b[0]);
    }
    return min;
  }
  /* Hoeveel de linkerkolom (links) en het geheel te groot zijn; 1 = past precies. */
  function overloop(staand, s){
    var W = innerWidth, rand = 28 * s;
    var app = $('app'), links = $('links');
    var p = $('plan').getBoundingClientRect(), l = links.getBoundingClientRect();
    var uPx = p.width / PLATTEGROND.breedte;
    var uit = { links: 1, geheel: 1 };
    if (staand) uit.geheel = app.scrollHeight / app.clientHeight;
    else uit.links = links.scrollHeight / links.clientHeight;
    [$('klok').parentNode, $('datum').parentNode, $('thermo'), $('overig'), $('allesUit').parentNode].forEach(function(el){
      var r = el.getBoundingClientRect();
      if (!r.width) return;
      var grens = W - rand;
      if (!staand) {
        var x = muurLinks((r.top - p.top) / uPx - 6, (r.bottom - p.top) / uPx + 6);
        if (x !== Infinity) grens = p.left + x * uPx - 12 * s;
      }
      uit.links = Math.max(uit.links, (r.right - l.left) / Math.max(1, grens - l.left));
    });
    return uit;
  }
  function maat(){
    var W = innerWidth, H = innerHeight, P = PLATTEGROND, s, u;
    var staand = W < H;
    document.documentElement.classList.toggle('staand', staand);
    if (staand) {
      s = W / 620;
      u = (W - 56 * s) / P.breedte;
    } else {
      s = Math.min(W / 1024, H / 700);
      u = Math.min((H - 56 * s) / P.hoogte, (W * 0.66 - 28 * s) / P.breedte);
    }
    var s0 = s;
    for (var i = 0; i < 40; i++) {
      zetMaat(s, u);
      var o = overloop(staand, s);
      if (o.links <= 1.002 && o.geheel <= 1.002) break;
      if (o.geheel > 1.002) {
        // Staand te hoog: eerst de kop kleiner, daarna kop en plattegrond samen
        var f = Math.max(0.9, 1 / o.geheel);
        s *= f;
        if (s < s0 * 0.72) u *= f;
      } else {
        s *= Math.max(0.9, 1 / o.links);
      }
    }
    if (typeof snoeiAgenda === 'function') snoeiAgenda();
  }
  var pasTimer = null;
  function pasAan(){ clearTimeout(pasTimer); pasTimer = setTimeout(maat, 30); }

  /* ---------- Klok en datum ---------- */
  var DAGEN = ['Zondag','Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag'];
  var MAANDEN = ['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];
  function klok(){
    var d = new Date();
    $('klok').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    $('datum').textContent = DAGEN[d.getDay()] + ' ' + d.getDate() + ' ' + MAANDEN[d.getMonth()] + ' ' + d.getFullYear();
  }
  klok(); setInterval(klok, 5000);

  /* ---------- Weer (alleen als lat/lon zijn meegegeven) ----------
     Geanimeerde iconen, opgebouwd uit losse onderdelen op een vlak van 48 x 48.
     Testen zonder te wachten op het weer: zet #weertest=<code>,<dag 1/0>,<graden> in de link,
     bv. #weertest=95,0,7 (onweer in de nacht). Codes: de WMO-weercodes van open-meteo. */
  var WEER = {
    zon: '<circle class="w-gloed" cx="24" cy="24" r="13"/><g class="w-zon"><circle cx="24" cy="24" r="8.5"/>' +
      '<g class="w-stralen"><path d="M24 6.5v4M24 37.5v4M6.5 24h4M37.5 24h4M11.6 11.6l2.9 2.9M36.4 11.6l-2.9 2.9M11.6 36.4l2.9-2.9M36.4 36.4l-2.9-2.9"/></g></g>',
    maan: '<mask id="maanMasker"><rect width="48" height="48" fill="#fff"/><circle cx="31.5" cy="18.5" r="11.5" fill="#000"/></mask>' +
      '<circle class="w-maan" cx="23" cy="25" r="14" mask="url(#maanMasker)"/>' +
      '<circle class="w-ster" cx="36" cy="12" r="1.5"/><circle class="w-ster b" cx="41" cy="23" r="1.1"/><circle class="w-ster c" cx="30" cy="20" r="1"/>',
    wolk: function(donker){ return '<g class="w-wolk' + (donker ? ' donker' : '') + '"><circle cx="16" cy="28" r="6.5"/><circle cx="25" cy="22.5" r="9.5"/><circle cx="34" cy="27.5" r="6.5"/><rect x="16" y="26" width="18" height="8.5"/></g>'; },
    druppels: function(licht){ var k = 'w-drup' + (licht ? ' licht' : ''); return '<path class="' + k + '" d="M18 33l-2 6"/><path class="' + k + ' b" d="M25.5 33l-2 6"/><path class="' + k + ' c" d="M33 33l-2 6"/>'; },
    vlokken: '<circle class="w-vlok" cx="17" cy="35" r="1.7"/><circle class="w-vlok b" cx="25" cy="36" r="1.7"/><circle class="w-vlok c" cx="33" cy="35" r="1.7"/>',
    bliksem: '<path class="w-bliksem" d="M26.5 29l-7 10h5l-2.5 8 9-11.5h-5l3-6.5z"/>',
    mist: '<path class="w-mist" d="M9 18h30"/><path class="w-mist b" d="M12 26h26"/><path class="w-mist c" d="M9 34h30"/>'
  };
  function weerBeeld(code, dag){
    var hemel = dag ? WEER.zon : WEER.maan, deel, tekst;
    function klein(inhoud){ return '<g transform="translate(15 -2) scale(.62)">' + inhoud + '</g>'; }
    function hoog(inhoud){ return '<g transform="translate(0 -8)"><g class="w-zweef">' + inhoud + '</g></g>'; }
    if (code <= 1) { deel = hemel; tekst = dag ? (code === 0 ? 'Zonnig' : 'Vrijwel onbewolkt') : 'Helder'; }
    else if (code === 2) { deel = klein(hemel) + '<g transform="translate(-3 5)"><g class="w-zweef">' + WEER.wolk() + '</g></g>'; tekst = 'Half bewolkt'; }
    else if (code === 3) { deel = '<g class="w-zweef">' + WEER.wolk() + '</g>'; tekst = 'Bewolkt'; }
    else if (code === 45 || code === 48) { deel = WEER.mist; tekst = 'Mist'; }
    else if (code >= 51 && code <= 57) { deel = hoog(WEER.wolk()) + WEER.druppels(true); tekst = 'Motregen'; }
    else if ((code >= 71 && code <= 77) || code === 85 || code === 86) { deel = hoog(WEER.wolk()) + WEER.vlokken; tekst = 'Sneeuw'; }
    else if (code >= 95) { deel = hoog(WEER.wolk(true)) + WEER.bliksem + '<g transform="translate(2 0)">' + WEER.druppels() + '</g>'; tekst = 'Onweer'; }
    else { deel = hoog(WEER.wolk(code === 65 || code === 67 || code === 82)) + WEER.druppels(); tekst = code >= 80 ? 'Buien' : 'Regen'; }
    return { svg: '<svg viewBox="0 0 48 48" aria-hidden="true">' + deel + '</svg>', tekst: tekst };
  }
  function toonWeer(graden, code, dag){
    var b = weerBeeld(Number(code), Number(dag) !== 0);
    $('weerIcoon').innerHTML = b.svg;
    $('weerTemp').textContent = Math.round(graden) + '°C';
    $('weerOms').textContent = b.tekst;
    $('weer').hidden = false;
    pasAan();
  }
  function weer(){
    var proef = par('weertest');
    if (proef) { var p = proef.split(','); toonWeer(p[2] == null ? 12 : Number(p[2]), p[0], p[1] == null ? 1 : p[1]); return; }
    if (!LAT || !LON) return;
    fetch('https://api.open-meteo.com/v1/forecast?latitude=' + encodeURIComponent(LAT) + '&longitude=' + encodeURIComponent(LON) + '&current=temperature_2m,weather_code,is_day')
      .then(function(r){ return r.json(); })
      .then(function(j){ if (j && j.current) toonWeer(j.current.temperature_2m, j.current.weather_code, j.current.is_day); })
      .catch(function(){});
  }

  /* ---------- Communicatie ---------- */
  /* Meldt aan lampen.py wat de pagina doet (komt daar in het logboek). Nooit de sleutel. */
  var gemeld = '';
  function meld(t){
    if (location.protocol !== 'http:' || t === gemeld) return;
    gemeld = t;
    try { new Image().src = 'meld?t=' + encodeURIComponent(t) + '&_=' + Date.now(); } catch (e) {}
  }
  addEventListener('error', function(e){ meld('scriptfout: ' + (e.message || '?') + ' (regel ' + (e.lineno || '?') + ')'); });
  (function(){
    var eens = function(){ meld('aanraking werkt'); removeEventListener('pointerdown', eens, true); removeEventListener('touchstart', eens, true); };
    addEventListener('pointerdown', eens, true); addEventListener('touchstart', eens, true);
  })();

  /* Eén aanroep naar de bediening. Is er thuis een brug (brug.py) en is die bereikbaar,
     dan gaat het daarlangs: rechtstreeks over het thuisnetwerk, dus snel. Anders via de
     web-app. Het adres van de brug komt van de web-app en wordt op dit apparaat onthouden. */
  var BRUG = bewaar('brug', '');
  var brugUitTot = 0, viaBrug = false, laatsteStand = 0;
  /* direct = true: altijd via de web-app (voor wat de brug toch alleen maar zou doorsturen) */
  function vraag(opdracht, direct){
    var tekst = JSON.stringify(Object.assign({ key: KEY }, opdracht));
    function viaWebapp(){
      if (!direct) viaBrug = false;
      return fetch(API, { method:'POST', body: tekst }).then(function(r){ return r.json(); }).then(function(j){
        if (j && typeof j.brug === 'string' && j.brug !== BRUG) {
          BRUG = j.brug; brugUitTot = 0;
          try { if (BRUG) localStorage.setItem('lampen_brug', BRUG); else localStorage.removeItem('lampen_brug'); } catch (e) {}
        }
        return j;
      });
    }
    if (direct || !BRUG || Date.now() < brugUitTot) return viaWebapp();
    var stop = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function(){ if (stop) stop.abort(); }, 3000);
    return fetch(BRUG, { method:'POST', body: tekst, signal: stop ? stop.signal : undefined })
      .then(function(r){ return r.json(); })
      .then(function(j){
        // Kent de brug deze sleutel niet (bijvoorbeeld na het wijzigen ervan), dan beslist de web-app
        if (!j || (j.ok === false && j.fout === 'Onjuiste sleutel')) throw new Error('brug weigert');
        clearTimeout(timer); viaBrug = true; return j;
      })
      .catch(function(){
        // Brug niet bereikbaar (pc uit, of dit apparaat zit niet in het thuisnetwerk): een minuut via de web-app
        clearTimeout(timer); brugUitTot = Date.now() + 60000;
        return viaWebapp();
      });
  }

  function stip(s, tekst){ $('stip').className = 'stip' + (s ? ' '+s : ''); $('stip').title = tekst || ''; }

  function melding(t){
    var m = $('melding'); m.textContent = t; m.classList.add('toon');
    clearTimeout(melding.t); melding.t = setTimeout(function(){ m.classList.remove('toon'); }, 4000);
  }

  function haalStand(vers){
    if (DEMO) { if (!ruimtes.length) ruimtes = demoData(); teken(); meld('geladen: demo, ' + innerWidth + 'x' + innerHeight); return Promise.resolve(); }
    stip('bezig');
    return vraag({ action: vers ? 'refresh' : 'state' }).then(function(j){
      if (!j.ok) throw new Error(j.fout || 'Onbekende fout');
      laatsteStand = Date.now();
      // Lopende opdrachten niet overschrijven met oudere stand
      var oud = {}; ruimtes.forEach(function(r){ oud[r.id] = r; });
      ruimtes = j.ruimtes.filter(function(r){ return TOON_OVERIG || opPlattegrond(r); })
        .map(function(r){ return bezig[r.id] && oud[r.id] ? oud[r.id] : r; });
      stip('', 'Bijgewerkt ' + new Date().toLocaleTimeString('nl-NL') + (viaBrug ? ' via de brug thuis' : ' via de web-app'));
      teken();
      meld('geladen: gekoppeld, ' + ruimtes.length + ' ruimtes, ' + innerWidth + 'x' + innerHeight);
    }).catch(function(e){
      if (String(e.message) === 'Onjuiste sleutel') { toonKoppelen('De sleutel op dit apparaat klopt niet.'); return; }
      meld('fout bij ophalen: ' + (e.message || e));
      stip('fout', String(e.message || e));
      melding((ruimtes.length ? 'Geen verbinding: ' : 'Kan de lampen niet bereiken: ') + (e.message || e));
    });
  }

  /* stil (optioneel): lampen die als offline gemeld staan. Ze krijgen de opdracht toch (die
     melding loopt soms minuten achter), maar als ze niet reageren klagen we daar niet over. */
  function stuur(ruimteId, ids, aan, helder, extra, stil){
    if (DEMO) return new Promise(function(ok){ setTimeout(ok, 350); });
    var body = { action: 'set', ids: ids };
    if (aan !== null) body.on = aan;
    if (helder !== null) body.bright = helder;
    if (extra && extra.temp != null) body.temp = extra.temp;
    if (extra && extra.kleur != null) body.kleur = extra.kleur;
    return vraag(body).then(function(j){
      if (!j.ok) throw new Error(j.fout || 'Onbekende fout');
      var mis = (j.resultaat || []).filter(function(x){ return !x.ok && !(stil && stil[x.id]); });
      if (mis.length) melding(mis.length + ' lamp' + (mis.length > 1 ? 'en reageerden' : ' reageerde') + ' niet');
      gemeld = ''; meld('geschakeld: ' + ids.length + ' lamp(en)' + (mis.length ? ', ' + mis.length + ' zonder reactie' : ''));
    });
  }

  /* Voert een wijziging direct zichtbaar door, stuurt hem en haalt daarna de echte stand op. */
  /* extra (optioneel): { temp: 0-100 } voor warm (0) tot koud (100) wit, of { kleur: 0-360 } voor een kleurtoon.
     Alleen lampen die dat kunnen doen mee. */
  function wijzig(r, lampen, aan, helder, extra){
    if (extra && extra.temp != null) lampen = lampen.filter(function(l){ return l.temp != null; });
    if (extra && extra.kleur != null) lampen = lampen.filter(function(l){ return l.rgb; });
    var ids = lampen.map(function(l){ return l.id; });
    if (!ids.length) return;
    var stil = {};
    lampen.forEach(function(l){ if (!l.online) stil[l.id] = true; });
    lampen.forEach(function(l){
      if (!l.online) return;
      if (aan !== null) l.on = aan;
      if (helder !== null) { l.bright = helder; l.on = true; }
      if (extra && extra.temp != null) { l.temp = extra.temp; l.tint = null; l.on = true; }
      if (extra && extra.kleur != null) { l.tint = extra.kleur; l.on = true; }
    });
    bezig[r.id] = (bezig[r.id] || 0) + 1;
    teken();
    stuur(r.id, ids, aan, helder, extra, stil).catch(function(e){ melding('Mislukt: ' + (e.message || e)); })
      .then(function(){
        bezig[r.id]--; if (!bezig[r.id]) delete bezig[r.id];
        clearTimeout(bijwerkTimer);
        bijwerkTimer = setTimeout(function(){ haalStand(); }, 3500);
        teken();
      });
  }

  /* ---------- Hulpjes ---------- */
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function norm(s){ return String(s || '').trim().toLowerCase(); }
  function aantalAan(r){ return r.lamps.filter(function(l){ return l.on; }).length; }
  function gemHelder(r){
    var a = r.lamps.filter(function(l){ return l.on && l.bright != null; });
    if (!a.length) a = r.lamps.filter(function(l){ return l.bright != null; });
    if (!a.length) return null;
    return Math.round(a.reduce(function(s,l){ return s + l.bright; }, 0) / a.length);
  }
  function vind(id){ for (var i = 0; i < ruimtes.length; i++) if (ruimtes[i].id === id) return ruimtes[i]; return null; }
  function standTekst(r){
    var n = aantalAan(r), tot = r.lamps.length;
    var offline = r.lamps.filter(function(l){ return !l.online; }).length;
    if (offline === tot) return 'Offline';
    return n === 0 ? 'Uit' : n === tot ? 'Aan' : n + ' van ' + tot;
  }
  /* De ruimte uit de app die bij een kamer op de plattegrond hoort. */
  function ruimteVan(k){
    var namen = [k.naam].concat(k.ook || []).map(norm);
    for (var i = 0; i < ruimtes.length; i++) if (namen.indexOf(norm(ruimtes[i].name)) >= 0) return ruimtes[i];
    return null;
  }
  var paneelSinds = 0;
  function opPlattegrond(r){
    return PLATTEGROND.kamers.some(function(k){
      return [k.naam].concat(k.ook || []).map(norm).indexOf(norm(r.name)) >= 0;
    });
  }
  function openPaneel(id){ open = id; paneelSinds = Date.now(); tekenPaneel(); $('paneel').classList.add('open'); }

  /* Gebaren op een element:
       o.kort()        kort tikken
       o.lang()        ruim een halve seconde vasthouden
       o.sleep(x, y)   vegen (optioneel); o.staand = true: omhoog/omlaag i.p.v. links/rechts
       o.sleepEind()   vinger los na het vegen */
  var HEEFT_TOUCH = 'ontouchstart' in window;
  function gebaar(el, o){
    var timer = null, x0 = 0, y0 = 0, actief = false, sleept = false, wasLang = false, onderdruk = false;
    function begin(x, y){
      actief = true; sleept = false; wasLang = false; x0 = x; y0 = y;
      clearTimeout(timer);
      timer = setTimeout(function(){ if (actief && !sleept) { wasLang = true; o.lang(); } }, 550);
    }
    function beweeg(x, y, e){
      if (!actief || wasLang || !o.sleep) return;
      if (!sleept) {
        if (Math.abs(o.staand ? y - y0 : x - x0) < 14) return;
        sleept = true; clearTimeout(timer);
      }
      if (e && e.cancelable) e.preventDefault();
      o.sleep(x, y);
    }
    function eind(){
      if (!actief) return;
      actief = false; clearTimeout(timer);
      if (sleept) {
        onderdruk = true; setTimeout(function(){ onderdruk = false; }, 400);
        if (o.sleepEind) o.sleepEind();
      }
    }
    if (HEEFT_TOUCH) {
      el.addEventListener('touchstart', function(e){ var t = e.touches[0]; begin(t.clientX, t.clientY); });
      el.addEventListener('touchmove', function(e){ var t = e.touches[0]; beweeg(t.clientX, t.clientY, e); }, { passive: false });
      el.addEventListener('touchend', eind);
      el.addEventListener('touchcancel', eind);
    }
    // Muis (en aanraakschermen zonder touch-events) via pointer-events
    el.addEventListener('pointerdown', function(e){
      if (HEEFT_TOUCH && e.pointerType === 'touch') return;
      begin(e.clientX, e.clientY);
      var mee = function(ev){ beweeg(ev.clientX, ev.clientY, ev); };
      var los = function(){ removeEventListener('pointermove', mee); removeEventListener('pointerup', los); removeEventListener('pointercancel', los); eind(); };
      addEventListener('pointermove', mee); addEventListener('pointerup', los); addEventListener('pointercancel', los);
    });
    el.addEventListener('click', function(){
      if (wasLang || onderdruk) { wasLang = false; onderdruk = false; return; }
      o.kort();
    });
    el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  }

  /* ---------- Plattegrond opbouwen (eenmalig) ---------- */
  function muurPad(punten, r){
    var n = punten.length, d = '';
    function naar(a, b, afstand){
      var dx = b[0] - a[0], dy = b[1] - a[1], len = Math.sqrt(dx * dx + dy * dy) || 1;
      return [a[0] + dx / len * afstand, a[1] + dy / len * afstand];
    }
    for (var i = 0; i < n; i++) {
      var vorig = punten[(i + n - 1) % n], p = punten[i], volgend = punten[(i + 1) % n];
      var a = naar(p, vorig, r), b = naar(p, volgend, r);
      d += (i ? 'L' : 'M') + a[0] + ' ' + a[1] + 'Q' + p[0] + ' ' + p[1] + ' ' + b[0] + ' ' + b[1];
    }
    return d + 'Z';
  }
  function u(n){ return 'calc(var(--u)*' + n + ')'; }

  function bouwPlan(){
    var P = PLATTEGROND, el = $('plan');
    el.innerHTML = '<svg class="muur" viewBox="0 0 ' + P.breedte + ' ' + P.hoogte + '" preserveAspectRatio="none"><path d="' + muurPad(P.muur, 12) + '"/></svg>';
    P.kamers.forEach(function(k){
      var d = document.createElement('section');
      d.className = 'kamer' + (k.licht === 'vol' ? ' vol' : '') + (k.draai ? ' draai' : '') + (k.hal ? ' hal' : '');
      d.style.left = u(k.x); d.style.top = u(k.y); d.style.width = u(k.w); d.style.height = u(k.h);
      d.style.setProperty('--bx', u(k.lamp[0])); d.style.setProperty('--by', u(k.lamp[1]));
      d.innerHTML = '<span class="balk"></span><span class="naam"></span><button class="knop" aria-label="Aan/uit">' + ICOON.lamp + '</button><span class="status"></span>';
      var naam = d.querySelector('.naam'), knop = d.querySelector('.knop'), status = d.querySelector('.status');
      naam.textContent = k.naam;
      naam.style.left = u(k.tekst[0]); naam.style.top = u(k.tekst[1]);
      knop.style.left = u(k.lamp[0]); knop.style.top = u(k.lamp[1]);
      status.style.left = u(k.status[0]); status.style.top = u(k.status[1]);
      // Tik ergens in de kamer: alles aan/uit. Lang indrukken: helderheid en losse lampen.
      // Vegen: de kamer is een helderheidsbalk (links dim, rechts fel; staande kamer: onder dim, boven fel).
      var balk = d.querySelector('.balk');
      gebaar(d, {
        staand: !!k.draai,
        kort: function(){
          var r = ruimteVan(k);
          if (!r) { melding('Geen lampen gevonden voor ' + k.naam); return; }
          wijzig(r, r.lamps, aantalAan(r) === 0, null);
        },
        lang: function(){
          var r = ruimteVan(k);
          if (r) openPaneel(r.id); else melding('Geen lampen gevonden voor ' + k.naam);
        },
        sleep: function(x, y){
          var r = ruimteVan(k);
          if (!r || gemHelder(r) == null) return;
          var b = d.getBoundingClientRect();
          var f = k.draai ? (b.bottom - y) / b.height : (x - b.left) / b.width;
          var v = Math.max(1, Math.min(100, Math.round((f - 0.06) / 0.88 * 100)));
          k.dim = v;
          clearTimeout(k.dimTimer);
          d.classList.add('dimt'); d.classList.add('aan');
          if (k.draai) balk.style.height = v + '%'; else balk.style.width = v + '%';
          d.style.setProperty('--gloed', (0.5 + 0.5 * v / 100).toFixed(2));
          status.textContent = v + '%';
        },
        sleepEind: function(){
          var r = ruimteVan(k), v = k.dim;
          k.dim = null;
          k.dimTimer = setTimeout(function(){ d.classList.remove('dimt'); }, 900);
          if (r && v != null) wijzig(r, r.lamps, null, v); else teken();
        }
      });
      k.el = d;
      el.appendChild(d);
    });
  }

  /* ---------- Tekenen ---------- */
  function teken(){
    var gebruikt = {};
    PLATTEGROND.kamers.forEach(function(k){
      var r = ruimteVan(k), d = k.el;
      if (r) gebruikt[r.id] = true;
      if (k.dim != null) return;   // er wordt geveegd: de balk niet overschrijven
      var n = r ? aantalAan(r) : 0, h = r ? gemHelder(r) : null;
      d.classList.toggle('leeg', !r);
      d.classList.toggle('aan', n > 0);
      d.classList.toggle('bezig', !!(r && bezig[r.id]));
      d.style.setProperty('--gloed', n > 0 ? (0.5 + 0.5 * (h == null ? 1 : h / 100)).toFixed(2) : 0);
      d.querySelector('.status').textContent = r ? standTekst(r) : '–';
    });
    tekenOverig(ruimtes.filter(function(r){ return !gebruikt[r.id]; }));
    if (open) tekenPaneel();
  }

  /* Ruimtes uit de app die niet op de plattegrond staan: als knopjes linksonder. */
  function tekenOverig(lijst){
    var el = $('overig');
    var sleutel = lijst.map(function(r){ return r.id; }).join('|');
    if (el.dataset.sleutel !== sleutel) {
      el.dataset.sleutel = sleutel; el.innerHTML = '';
      lijst.forEach(function(r){
        var b = document.createElement('button');
        b.className = 'chip'; b.dataset.id = r.id;
        b.innerHTML = ICOON.lamp + '<span></span><small></small>';
        gebaar(b, {
          kort: function(){ var ru = vind(b.dataset.id); if (ru) wijzig(ru, ru.lamps, aantalAan(ru) === 0, null); },
          lang: function(){ openPaneel(b.dataset.id); }
        });
        el.appendChild(b);
      });
      pasAan();
    }
    lijst.forEach(function(r, i){
      var b = el.children[i];
      b.classList.toggle('aan', aantalAan(r) > 0);
      b.querySelector('span').textContent = r.name;
      b.querySelector('small').textContent = standTekst(r);
    });
  }

  function zetSchuif(inp, pct, h){
    if (inp.dataset.sleept) return;
    inp.disabled = h == null;
    inp.value = h == null ? 100 : h;
    inp.style.setProperty('--v', (h == null ? 0 : h) + '%');
    pct.textContent = h == null ? '' : h + '%';
  }
  function koppelSchuif(inp, pct, klaar){
    inp.addEventListener('input', function(){
      inp.dataset.sleept = '1';
      inp.style.setProperty('--v', inp.value + '%'); pct.textContent = inp.value + '%';
    });
    inp.addEventListener('change', function(){ delete inp.dataset.sleept; klaar(Number(inp.value)); });
  }

  /* ---------- Paneel: hele ruimte + losse lampen ---------- */
  var RIJ = '<div class="dim"><input type="range" min="1" max="100" step="1"><span class="pct"></span></div>';
  /* Warm/koud wit (schuif) en kleur (rondjes); alleen zichtbaar bij lampen die het kunnen. */
  var KLEUREN = [0, 28, 52, 120, 175, 225, 270, 320];
  var TINT = '<div class="wit"><input class="warm" type="range" min="0" max="100" step="1" aria-label="Warm of koud wit"></div>' +
    '<div class="kleuren">' + KLEUREN.map(function(h){
      return '<button class="kl" data-h="' + h + '" style="background:hsl(' + h + ',85%,55%)" aria-label="Kleur"></button>';
    }).join('') + '</div>';
  /* Koppelt de schuif en de kleurrondjes van één blok; 'wie' geeft de ruimte en de lampen waar het om gaat. */
  function koppelTint(blok, wie){
    var warm = blok.querySelector('.warm');
    warm.addEventListener('input', function(){ warm.dataset.sleept = '1'; });
    warm.addEventListener('change', function(){
      delete warm.dataset.sleept;
      var w = wie(); if (w) wijzig(w.ruimte, w.lampen, null, null, { temp: Number(warm.value) });
    });
    Array.prototype.forEach.call(blok.querySelectorAll('.kl'), function(k){
      k.addEventListener('click', function(){
        var w = wie(); if (w) wijzig(w.ruimte, w.lampen, null, null, { kleur: Number(k.dataset.h) });
      });
    });
  }
  function toonTint(blok, lampen){
    var metTemp = lampen.filter(function(l){ return l.temp != null; });
    var metKleur = lampen.filter(function(l){ return l.rgb; });
    var warm = blok.querySelector('.warm');
    blok.querySelector('.wit').style.display = metTemp.length ? '' : 'none';
    blok.querySelector('.kleuren').style.display = metKleur.length ? '' : 'none';
    if (metTemp.length && !warm.dataset.sleept) {
      warm.value = Math.round(metTemp.reduce(function(s, l){ return s + l.temp; }, 0) / metTemp.length);
    }
    var tint = metKleur.length && metKleur.every(function(l){ return l.tint != null && l.on; }) ? metKleur[0].tint : null;
    Array.prototype.forEach.call(blok.querySelectorAll('.kl'), function(k){
      var d = tint == null ? 999 : Math.abs(Number(k.dataset.h) - tint); d = Math.min(d, 360 - d);
      k.classList.toggle('actief', d <= 14);
    });
  }
  function tekenPaneel(){
    var r = vind(open); if (!r) { sluitPaneel(); return; }
    $('velNaam').textContent = r.name;
    $('velKop').classList.toggle('aan', aantalAan(r) > 0);
    var lijst = $('lampen');
    if (lijst.dataset.ruimte !== r.id || lijst.children.length !== r.lamps.length + 1) {
      lijst.dataset.ruimte = r.id; lijst.innerHTML = '';
      var g = document.createElement('div'); g.className = 'lamp geheel';
      g.innerHTML = '<div class="ln">Hele ruimte</div>' + RIJ + TINT;
      koppelSchuif(g.querySelector('input'), g.querySelector('.pct'), function(v){
        var ru = vind(open); if (ru) wijzig(ru, ru.lamps, null, v);
      });
      koppelTint(g, function(){ var ru = vind(open); return ru && { ruimte: ru, lampen: ru.lamps }; });
      lijst.appendChild(g);
      r.lamps.forEach(function(l){
        var d = document.createElement('div'); d.className = 'lamp'; d.dataset.id = l.id;
        d.innerHTML = '<div class="ln"></div><button class="schakel" aria-label="Aan/uit"></button>' + RIJ + TINT;
        koppelTint(d, function(){
          var ru = vind(open), la = ru && ru.lamps.filter(function(x){ return x.id === l.id; })[0];
          return la && { ruimte: ru, lampen: [la] };
        });
        d.querySelector('.schakel').addEventListener('click', function(){
          var ru = vind(open), la = ru && ru.lamps.filter(function(x){ return x.id === l.id; })[0];
          if (la) wijzig(ru, [la], !la.on, null);
        });
        koppelSchuif(d.querySelector('input'), d.querySelector('.pct'), function(v){
          var ru = vind(open), la = ru && ru.lamps.filter(function(x){ return x.id === l.id; })[0];
          if (la) wijzig(ru, [la], null, v);
        });
        lijst.appendChild(d);
      });
    }
    var geheel = lijst.children[0], h = gemHelder(r);
    geheel.style.display = h == null ? 'none' : '';
    zetSchuif(geheel.querySelector('input'), geheel.querySelector('.pct'), h);
    toonTint(geheel, r.lamps);
    r.lamps.forEach(function(l, i){
      var d = lijst.children[i + 1];
      d.classList.toggle('aan', l.on); d.classList.toggle('offline', !l.online);
      d.querySelector('.ln').innerHTML = esc(l.name) + (l.online ? '' : '<small>offline</small>');
      d.querySelector('.dim').style.display = l.bright == null ? 'none' : '';
      zetSchuif(d.querySelector('input'), d.querySelector('.pct'), l.bright);
      toonTint(d, [l]);
    });
  }
  function sluitPaneel(){ open = null; $('paneel').classList.remove('open'); }
  $('sluit').addEventListener('click', sluitPaneel);
  // Niet meteen weer sluiten door het loslaten van de lange druk waarmee het paneel openging
  $('paneel').addEventListener('click', function(e){ if (e.target === $('paneel') && Date.now() - paneelSinds > 600) sluitPaneel(); });
  $('velSchakel').addEventListener('click', function(){
    var r = vind(open); if (r) wijzig(r, r.lamps, aantalAan(r) === 0, null);
  });

  /* ---------- Alles uit ---------- */
  $('allesUit').addEventListener('click', function(){
    var iets = false;
    ruimtes.forEach(function(r){ if (aantalAan(r)) { iets = true; wijzig(r, r.lamps, false, null); } });
    if (!iets) melding('Alle lampen zijn al uit');
  });
  /* ---------- Partyknop: scène 'party' aan, nog een keer = scène 'standaard' ---------- */
  (function(){
    var knop = $('party'), aan = false, bezigMet = false;
    knop.innerHTML = ICOON.disco;
    try { aan = localStorage.getItem('lampen_party') === '1'; } catch (e) {}
    function toon(){ knop.classList.toggle('aan', aan); knop.classList.toggle('bezig', bezigMet); }
    function onthoud(){ try { localStorage.setItem('lampen_party', aan ? '1' : '0'); } catch (e) {} }
    function start(naam){
      if (DEMO) return new Promise(function(ok){ setTimeout(ok, 350); });
      return vraag({ action: 'scene', name: naam })
        .then(function(j){ if (!j.ok) throw new Error(j.fout || 'Onbekende fout'); });
    }
    knop.addEventListener('click', function(){
      if (bezigMet) return;
      var naar = !aan, naam = naar ? SCENES.party : SCENES.standaard;
      aan = naar; bezigMet = true; toon();
      start(naam).then(function(){
        onthoud();
        gemeld = ''; meld('scène gestart: ' + naam);
        clearTimeout(bijwerkTimer); bijwerkTimer = setTimeout(function(){ haalStand(); }, 3500);
      }).catch(function(e){
        aan = !naar;
        melding('Scène "' + naam + '" mislukt: ' + (e.message || e));
        gemeld = ''; meld('scène mislukt: ' + naam + ' – ' + (e.message || e));
      }).then(function(){ bezigMet = false; toon(); });
    });
    toon();
  })();

  /* ---------- Agenda: afspraken van vandaag en morgen (uit Google Agenda, via de web-app) ---------- */
  var afspraken = [];
  function dagVan(d){ return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function tekenAgenda(){
    var el = $('agenda'), nu = new Date(), html = '', vorige = '';
    var vandaag = dagVan(nu), morgen = dagVan(new Date(nu.getFullYear(), nu.getMonth(), nu.getDate() + 1));
    afspraken.forEach(function(a){
      var start = new Date(a.start), eind = new Date(a.eind);
      if (isNaN(start) || eind <= nu) return;
      var dag = dagVan(start < nu ? nu : start);   // al bezig: onder vandaag
      if (dag !== vorige) {
        vorige = dag;
        html += '<div class="dag">' + (dag === vandaag ? 'Vandaag' : dag === morgen ? 'Morgen' : DAGEN[start.getDay()]) + '</div>';
      }
      var tijd = a.heleDag ? 'hele dag' : String(start.getHours()).padStart(2,'0') + ':' + String(start.getMinutes()).padStart(2,'0');
      html += '<div class="afspraak"><time>' + tijd + '</time><span>' + esc(a.titel || '(geen titel)') + '</span></div>';
    });
    el.innerHTML = html;
    snoeiAgenda();
  }
  /* Regels die niet meer helemaal in het vak passen verbergen (en een dagkop zonder regels ook). */
  function snoeiAgenda(){
    var el = $('agenda'), h = el.clientHeight, k = el.children;
    for (var i = 0; i < k.length; i++) k[i].style.visibility = (k[i].offsetTop - el.offsetTop + k[i].offsetHeight > h + 1) ? 'hidden' : '';
    for (var j = 0; j < k.length; j++) {
      if (k[j].className === 'dag' && (!k[j + 1] || k[j + 1].style.visibility === 'hidden')) k[j].style.visibility = 'hidden';
    }
  }
  function haalAgenda(){
    if (DEMO) { afspraken = demoAgenda(); tekenAgenda(); return; }
    if (!KEY) return;
    vraag({ action: 'agenda' }).then(function(j){
      afspraken = (j && j.ok && j.afspraken) || [];
      tekenAgenda();
    }).catch(function(){});
  }
  function demoAgenda(){
    var n = new Date();
    function op(dagen, uur, min){ return new Date(n.getFullYear(), n.getMonth(), n.getDate() + dagen, uur, min).toISOString(); }
    var straks = new Date(n.getTime() + 3600e3), later = new Date(n.getTime() + 3 * 3600e3);
    return [
      { titel:'Koffie met vrienden', start: straks.toISOString(), eind: new Date(straks.getTime() + 3600e3).toISOString() },
      { titel:'Sporten', start: later.toISOString(), eind: new Date(later.getTime() + 3600e3).toISOString() },
      { titel:'Verjaardag', start: op(1, 0, 0), eind: op(2, 0, 0), heleDag: true },
      { titel:'Werkoverleg', start: op(1, 9, 30), eind: op(1, 10, 30) }
    ];
  }

  /* ---------- Thermostaat (via de brug thuis; zie thermostaat.py) ----------
     Toont de kamertemperatuur en de ingestelde temperatuur, met een knopje omlaag en omhoog
     (halve graden). Zolang er geen thermostaat gekoppeld is, staan er voorbeeldwaarden. */
  var thermo = null, thermoTimer = null;
  function graden(x){ return x == null ? '–' : String(Math.round(x * 10) / 10).replace('.', ',') + '°'; }
  function tekenThermo(){
    var el = $('thermo'), t = thermo || { binnen: 20.5, ingesteld: 21, voorbeeld: true };
    el.classList.toggle('voorbeeld', !!t.voorbeeld);
    el.classList.toggle('stookt', !!t.stookt);
    $('thNu').textContent = graden(t.binnen);
    $('thDoel').textContent = graden(t.ingesteld);
    $('thSub').textContent = t.voorbeeld ? 'voorbeeld' : (t.stookt ? 'verwarmt' : 'binnen') + (t.stand === 'klok' ? ' · klok' : '');
    Array.prototype.forEach.call(document.querySelectorAll('#thMenu .th-optie'), function(o){
      o.classList.toggle('actief', (t.stand === 'klok' ? 'klok' : 'handmatig') === o.dataset.stand);
    });
    $('thMenuInfo').textContent = 'Binnen ' + graden(t.binnen) + ', ingesteld op ' + graden(t.ingesteld) +
      (t.buiten != null ? ', buiten ' + graden(t.buiten) : '') + (t.voorbeeld ? ' (voorbeeld)' : '') + '.';
  }
  function haalThermo(){
    if (DEMO || !KEY) { tekenThermo(); return; }
    vraag({ action: 'thermostaat' }).then(function(j){
      if (j && j.thermostaat && j.thermostaat.ok) thermo = j.thermostaat;
      tekenThermo();
    }).catch(function(){ tekenThermo(); });
  }
  function thermoStap(stap){
    var t = thermo || (thermo = { binnen: 20.5, ingesteld: 21, voorbeeld: true });
    t.ingesteld = Math.max(5, Math.min(30, Math.round(((t.ingesteld == null ? 20 : t.ingesteld) + stap) * 2) / 2));
    tekenThermo();
    if (t.voorbeeld) return;
    clearTimeout(thermoTimer);   // even wachten: een paar keer tikken wordt één opdracht
    thermoTimer = setTimeout(function(){
      vraag({ action: 'thermostaat', graden: t.ingesteld }).then(function(j){
        if (j && j.thermostaat && j.thermostaat.ok) { thermo = j.thermostaat; tekenThermo(); }
        else melding('Thermostaat instellen is niet gelukt');
      }).catch(function(){ melding('Thermostaat instellen is niet gelukt'); });
    }, 900);
  }
  /* Wisselt tussen het klokprogramma van de thermostaat en een vaste (handmatige) temperatuur. */
  document.querySelector('.th-nu').addEventListener('click', function(){ tekenThermo(); $('thMenu').hidden = false; });
  $('thMenu').addEventListener('click', function(e){ if (e.target === $('thMenu')) $('thMenu').hidden = true; });
  Array.prototype.forEach.call(document.querySelectorAll('#thMenu .th-optie'), function(o){
    o.addEventListener('click', function(){ $('thMenu').hidden = true; thermoStand(o.dataset.stand); });
  });
  function thermoStand(naar){
    var t = thermo || (thermo = { binnen: 20.5, ingesteld: 21, voorbeeld: true });
    if ((t.stand === 'klok' ? 'klok' : 'handmatig') === naar) return;
    t.stand = naar; tekenThermo();
    if (t.voorbeeld) return;
    vraag({ action: 'thermostaat', stand: naar }).then(function(j){
      if (j && j.thermostaat && j.thermostaat.ok) { setTimeout(haalThermo, 4000); }
      else melding('Thermostaat omzetten is niet gelukt');
    }).catch(function(){ melding('Thermostaat omzetten is niet gelukt'); });
  }
  $('thOmlaag').addEventListener('click', function(){ thermoStap(-0.5); });
  $('thOmhoog').addEventListener('click', function(){ thermoStap(0.5); });

  /* ---------- Robotstofzuiger (via de brug thuis; zie stofzuiger.py) ----------
     Het knopje verschijnt alleen als de brug een stofzuiger kent. Tik: menu met starten,
     pauze en terug naar het station. */
  var zuiger = null;
  $('zuiger').innerHTML = ICOON.zuiger;
  function tekenZuiger(){
    var z = zuiger, knop = $('zuiger');
    knop.hidden = !(z && z.ok);
    if (!z || !z.ok) return;
    knop.classList.toggle('bezig', z.stand === 'cleaning' || z.stand === 'returning');
    $('zuNaam').textContent = z.naam || 'Stofzuiger';
    $('zuInfo').textContent = (z.tekst || 'Onbekend') + (z.accu != null ? ' · accu ' + z.accu + '%' : '') + '.';
  }
  function haalZuiger(){
    if (DEMO || !KEY) return;
    vraag({ action: 'stofzuiger' }).then(function(j){
      zuiger = (j && j.stofzuiger && j.stofzuiger.ok) ? j.stofzuiger : null;
      tekenZuiger();
    }).catch(function(){});
  }
  $('zuiger').addEventListener('click', function(){ tekenZuiger(); $('zuMenu').hidden = false; });
  $('zuMenu').addEventListener('click', function(e){ if (e.target === $('zuMenu')) $('zuMenu').hidden = true; });
  Array.prototype.forEach.call(document.querySelectorAll('#zuMenu .th-optie'), function(o){
    o.addEventListener('click', function(){
      $('zuMenu').hidden = true;
      vraag({ action: 'stofzuiger', opdracht: o.dataset.opdracht }).then(function(j){
        if (j && j.stofzuiger && j.stofzuiger.ok) {
          zuiger = j.stofzuiger; tekenZuiger();
          setTimeout(haalZuiger, 4000); setTimeout(haalZuiger, 10000);
        } else melding('De stofzuiger reageert niet');
      }).catch(function(){ melding('De stofzuiger reageert niet'); });
    });
  });

  /* ---------- Kachel (Tuya; de brug thuis schakelt hem rechtstreeks) ----------
     Het knopje verschijnt alleen als er een kachel is gevonden. Tik = aan of uit. */
  var kachel = null, kachelBezig = false;
  $('kachel').innerHTML = ICOON.kachel;
  function tekenKachel(){
    var k = kachel, knop = $('kachel');
    knop.hidden = !(k && k.ok);
    if (!k || !k.ok) return;
    knop.classList.toggle('aan', !!k.aan);
    knop.classList.toggle('wacht', kachelBezig);
    knop.setAttribute('aria-pressed', k.aan ? 'true' : 'false');
    knop.title = (k.naam || 'Kachel') + (k.aan ? ' staat aan' : ' staat uit');
  }
  function haalKachel(){
    if (DEMO || !KEY || kachelBezig || document.hidden) return;
    vraag({ action: 'kachel' }).then(function(j){
      if (kachelBezig) return;
      kachel = (j && j.kachel && j.kachel.ok) ? j.kachel : null;
      tekenKachel();
    }).catch(function(){});
  }
  $('kachel').addEventListener('click', function(){
    if (!kachel || kachelBezig) return;
    var wens = !kachel.aan;
    if (DEMO) { kachel.aan = wens; tekenKachel(); return; }
    if (!kachel.online) { melding('De kachel is niet bereikbaar'); return; }
    kachelBezig = true; kachel.aan = wens; tekenKachel();
    vraag({ action: 'kachel', on: wens }).then(function(j){
      kachelBezig = false;
      if (j && j.kachel && j.kachel.ok) { kachel = j.kachel; setTimeout(haalKachel, 5000); }
      else { kachel.aan = !wens; melding('De kachel reageert niet'); }
      tekenKachel();
    }).catch(function(){ kachelBezig = false; kachel.aan = !wens; tekenKachel(); melding('De kachel reageert niet'); });
  });

  /* ---------- Intercom beneden (Ring, via de brug thuis; zie intercom.py) ----------
     Wordt er aangebeld, dan klinkt er een bel en verschijnt de knop 'Deur openen'. De brug
     staat dat alleen toe in de eerste minuten na het aanbellen. Zonder brug gebeurt er niets. */
  var bel = null, belGezien = 0, belTimer = null, geluid = null;
  // Geluid mag van de browser pas na een aanraking: bij de eerste tik klaarzetten
  function geluidKlaar(){
    try {
      var A = window.AudioContext || window.webkitAudioContext;
      if (!A) return;
      if (!geluid) geluid = new A();
      if (geluid.state === 'suspended') geluid.resume();
    } catch (e) {}
  }
  document.addEventListener('pointerdown', geluidKlaar, { passive: true });
  function dingdong(){
    if (!geluid) return;
    try {
      var nu = geluid.currentTime;
      [[659.3, 0], [523.3, 0.55], [659.3, 1.5], [523.3, 2.05]].forEach(function(n){
        var o = geluid.createOscillator(), g = geluid.createGain(), s = nu + n[1];
        o.type = 'sine'; o.frequency.value = n[0];
        g.gain.setValueAtTime(0.0001, s);
        g.gain.exponentialRampToValueAtTime(0.5, s + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, s + 1.1);
        o.connect(g); g.connect(geluid.destination); o.start(s); o.stop(s + 1.15);
      });
    } catch (e) {}
  }
  function tekenBel(){
    var b = bel, open = !!(b && b.ok && b.open_mag && b.gebeld && b.gebeld !== belGezien);
    if (open && $('belMenu').hidden) { dingdong(); $('belOpen').disabled = false; $('belOpen').textContent = 'Deur openen'; }
    $('belMenu').hidden = !open;
    if (open) $('belInfo').textContent = b.geopend ? 'De deur is geopend.' : 'Beneden bij de voordeur. Openen kan nog ' + b.rest + ' seconden.';
  }
  function haalBel(){
    clearTimeout(belTimer);
    // Snel kijken zolang de brug een intercom kent, anders af en toe
    function straks(){ belTimer = setTimeout(haalBel, (bel && bel.ok) ? 3000 : 60000); }
    if (DEMO || !KEY || !BRUG || document.hidden) { straks(); return; }
    vraag({ action: 'intercom' }).then(function(j){
      bel = (j && j.intercom && j.intercom.ok) ? j.intercom : null;
      tekenBel(); straks();
    }).catch(function(){ bel = null; straks(); });
  }
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) haalBel(); });
  $('belWeg').addEventListener('click', function(){ if (bel) belGezien = bel.gebeld; $('belMenu').hidden = true; });
  $('belOpen').addEventListener('click', function(){
    var knop = $('belOpen'); knop.disabled = true; knop.textContent = 'Bezig...';
    vraag({ action: 'intercom', opdracht: 'open' }).then(function(j){
      if (j && j.ok && j.intercom && j.intercom.geopend) {
        knop.textContent = 'Deur is open';
        var welke = j.intercom.gebeld;
        setTimeout(function(){ belGezien = welke; $('belMenu').hidden = true; }, 2500);
      } else {
        knop.disabled = false; knop.textContent = 'Deur openen';
        melding((j && j.fout) || 'De deur openen is niet gelukt');
      }
    }).catch(function(){ knop.disabled = false; knop.textContent = 'Deur openen'; melding('De deur openen is niet gelukt'); });
  });

  /* ---------- Omlaag vegen om te verversen ----------
     Een webapp op het beginscherm heeft geen ververs-knop en blijft anders op een oude versie
     hangen. Omlaag vegen (of slepen met de muis) haalt de nieuwste versie op, voorbij de
     opslag van de browser. Begint de veeg in een kamer of een menu, dan gebeurt er niets. */
  (function(){
    var el = $('ververs'), svg = el.firstChild, y0 = null, x0 = 0, dy = 0, actief = false, bezig = false, DREMPEL = 95;
    function mag(doel){ return !(doel && doel.closest && doel.closest('.kamer, input, textarea, .kaart, #paneel, #koppel')); }
    function teken(){
      var ver = Math.min(dy, 170) * 0.75;
      el.classList.remove('terug');
      el.style.opacity = Math.min(1, dy / 50);
      el.style.transform = 'translateY(' + ver + 'px)';
      svg.style.transform = 'rotate(' + Math.min(dy, 170) * 2.2 + 'deg)';
      el.classList.toggle('los', dy >= DREMPEL);
    }
    function weg(){ el.classList.add('terug'); el.classList.remove('los'); el.style.opacity = 0; el.style.transform = 'translateY(0)'; }
    function ververs(){
      bezig = true;
      el.classList.add('terug', 'bezig'); el.classList.remove('los');
      el.style.opacity = 1; el.style.transform = 'translateY(72px)'; svg.style.transform = '';
      var klaar = function(){ location.reload(); };
      // Eerst de pagina vers ophalen (dat vernieuwt ook de opslag van de browser), dan herladen
      var haal = window.fetch ? fetch(location.href.split('#')[0], { cache: 'reload' }) : Promise.resolve();
      haal.then(klaar, function(){
        bezig = false; el.classList.remove('bezig'); weg();
        melding('Verversen lukt niet: geen verbinding');
      });
    }
    function begin(x, y, doel){ if (bezig || !mag(doel)) { y0 = null; return; } y0 = y; x0 = x; dy = 0; actief = false; }
    function beweeg(x, y){
      if (y0 === null) return;
      var d = y - y0, zij = Math.abs(x - x0);
      if (!actief) {
        if (zij > 24 || d < -12) { y0 = null; return; }       // zijwaarts of omhoog: geen ververs-veeg
        if (d < 14 || d < zij * 1.5) return;
        actief = true;
      }
      dy = Math.max(0, d); teken();
    }
    function einde(){
      if (y0 === null) return;
      var doe = actief && dy >= DREMPEL;
      y0 = null; actief = false;
      if (doe) ververs(); else weg();
    }
    document.addEventListener('touchstart', function(e){
      if (e.touches.length !== 1) { y0 = null; weg(); return; }
      begin(e.touches[0].clientX, e.touches[0].clientY, e.target);
    }, { passive: true });
    document.addEventListener('touchmove', function(e){ if (e.touches.length === 1) beweeg(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    document.addEventListener('touchend', einde, { passive: true });
    document.addEventListener('touchcancel', function(){ y0 = null; actief = false; if (!bezig) weg(); }, { passive: true });
    // Met de muis (computer): omlaag slepen
    document.addEventListener('pointerdown', function(e){ if (e.pointerType === 'mouse' && e.button === 0) begin(e.clientX, e.clientY, e.target); });
    document.addEventListener('pointermove', function(e){ if (e.pointerType === 'mouse') beweeg(e.clientX, e.clientY); });
    document.addEventListener('pointerup', function(e){ if (e.pointerType === 'mouse') einde(); });
  })();

  /* ---------- Koppelen ----------
     Het adres van het script staat in de pagina (API_URL) of komt uit de link; de sleutel
     vult de gebruiker één keer per apparaat in. Hij staat daarna alleen in dat apparaat. */
  function toonKoppelen(fout){
    $('koppelFout').textContent = fout || '';
    $('koppel').hidden = false;
  }
  function zoekPlaats(naam){
    return fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=nl&name=' + encodeURIComponent(naam))
      .then(function(r){ return r.json(); })
      .then(function(j){
        var p = j && j.results && j.results[0];
        if (!p) throw new Error('De plaats "' + naam + '" is niet gevonden.');
        return p;
      });
  }
  $('koppelForm').addEventListener('submit', function(e){
    e.preventDefault();
    var sleutel = $('koppelSleutel').value.trim(), plaats = $('koppelPlaats').value.trim();
    if (!API) { $('koppelFout').textContent = 'Deze pagina kent het adres van het script nog niet.'; return; }
    if (!sleutel) { $('koppelFout').textContent = 'Vul de sleutel in.'; return; }
    $('koppelOk').disabled = true; $('koppelFout').textContent = 'Bezig…';
    var url = API + (API.indexOf('?') >= 0 ? '&' : '?') + 'action=state&key=' + encodeURIComponent(sleutel) + '&_=' + Date.now();
    fetch(url, { cache:'no-store' }).then(function(r){ return r.json(); }).then(function(j){
      if (!j.ok) throw new Error(j.fout === 'Onjuiste sleutel' ? 'De sleutel klopt niet.' : (j.fout || 'Onbekende fout'));
      return plaats ? zoekPlaats(plaats) : null;
    }).then(function(p){
      KEY = bewaar('key', sleutel);
      if (p) { LAT = bewaar('lat', p.latitude.toFixed(2)); LON = bewaar('lon', p.longitude.toFixed(2)); }
      DEMO = false;
      $('koppel').hidden = true; $('demo').hidden = true; $('koppelSleutel').value = '';
      if (!LAT || !LON) $('weer').hidden = true;
      ruimtes = [];
      haalStand(); weer(); haalAgenda();
    }).catch(function(err){
      $('koppelFout').textContent = err.message || String(err);
    }).then(function(){ $('koppelOk').disabled = false; });
  });
  $('koppelDemo').addEventListener('click', function(){ DEMO = true; $('koppel').hidden = true; haalStand(); haalAgenda(); });
  $('demo').addEventListener('click', function(){ toonKoppelen(); });
  // Lang indrukken op de datum: koppeling van dit apparaat wijzigen
  (function(){
    var t; var el = $('datum').parentNode;
    el.addEventListener('pointerdown', function(){ t = setTimeout(function(){ toonKoppelen(); }, 900); });
    ['pointerup','pointerleave','pointercancel'].forEach(function(n){ el.addEventListener(n, function(){ clearTimeout(t); }); });
  })();

  // Lang indrukken op de klok: lijst met lampen/ruimtes opnieuw ophalen
  (function(){
    var t; var el = $('klok');
    el.addEventListener('pointerdown', function(){ t = setTimeout(function(){ melding('Lampen opnieuw ophalen…'); haalStand(true); }, 900); });
    ['pointerup','pointerleave','pointercancel'].forEach(function(n){ el.addEventListener(n, function(){ clearTimeout(t); }); });
  })();

  /* ---------- Demo ---------- */
  function demoData(){
    $('demo').hidden = false;
    if (!LAT || !LON) toonWeer(12, 2, 1);
    function L(id, name, on, b){ return { id:id, name:name, online:true, on:on, bright:b, temp: b == null ? null : 35, rgb: b != null, tint: null }; }
    return [
      { id:'slaap', name:'Slaapkamer', lamps:[L('s1','Plafond',true,100), L('s2','Nachtlampje',true,60)] },
      { id:'hal', name:'Hal', lamps:[L('h1','Plafond',false,100)] },
      { id:'keuken', name:'Keuken', lamps:[L('k1','Spots',false,100), L('k2','Aanrecht',false,70)] },
      { id:'kast', name:'Kast', lamps:[L('c1','Plafond',false,null)] },
      { id:'woon', name:'Woonkamer', lamps:[L('w1','Plafond',true,80), L('w2','Staande lamp',true,60), L('w3','Lichtstrip tv',true,40)] }
    ];
  }

  /* ---------- Start ---------- */
  maat();
  bouwPlan();
  addEventListener('resize', maat);
  addEventListener('orientationchange', pasAan);
  // Nog geen sleutel op dit apparaat: eerst koppelen (of het voorbeeld bekijken)
  if (!DEMO && !KEY) toonKoppelen(); else haalStand();
  // Via de brug thuis is de stand ophalen goedkoop: dan elke 10 s, anders volgens POLL
  setInterval(function(){
    if (!DEMO && KEY && (viaBrug || Date.now() - laatsteStand > POLL - 1000)) haalStand();
  }, 10000);
  weer(); setInterval(weer, 15 * 60 * 1000);
  haalAgenda(); setInterval(haalAgenda, 10 * 60 * 1000);
  haalThermo(); setInterval(haalThermo, 60 * 1000);
  haalZuiger(); setInterval(haalZuiger, 30 * 1000);
  if (DEMO) { kachel = { ok: true, naam: 'Kachel', online: true, aan: false }; tekenKachel(); }
  haalKachel(); setInterval(haalKachel, 60 * 1000);
  // Proefdraaien zonder aan te bellen: zet #beltest in de link (opent de deur niet)
  if (hs.has('beltest')) setTimeout(function(){
    clearTimeout(belTimer);
    bel = { ok: true, gebeld: Date.now(), open_mag: true, rest: 120, geopend: false }; tekenBel();
  }, 1500);
  else haalBel();
  setInterval(tekenAgenda, 60 * 1000);   // afgelopen afspraken laten verdwijnen
  // Tablet of telefoon die weer wakker wordt: meteen de actuele stand en tijd tonen
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { klok(); if (!DEMO) { haalStand(); haalAgenda(); } } });
  // Elke 6 uur vers laden, zodat updates van de pagina vanzelf binnenkomen
  setTimeout(function(){ location.reload(); }, 6 * 3600 * 1000);
})();
</script>
